<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#EC4899">
  <title>随机开饭</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
</head>
<body>
  <div id="app">
    <!-- 导航栏 -->
    <div id="nav-bar">
      <button id="back-btn">‹ 返回</button>
      <span id="nav-title">随机开饭</span>
      <span style="width:40px;"></span>
    </div>

    <!-- 首页 - 随机开饭 -->
    <div class="page-container" id="page-index">
      <div class="header">
        <span class="title">今天吃什么？</span>
        <span class="subtitle">把选择交给命运 ✨</span>
      </div>

      <div id="source-selector"></div>
      <div id="combo-bar"></div>
      <div id="result-area"></div>
      <div id="history-area"></div>

      <button class="btn-random" id="btn-random">🎲 随机开饭</button>
      <div class="family-entry">
        <button class="btn-family-entry" id="index-family-btn">👨‍👩‍👧 家庭共享</button>
      </div>
    </div>

    <!-- 菜品管理 -->
    <div class="page-container" id="page-manage">
      <div class="popular-section">
        <span class="section-label">🔥 热门菜品 · 一键添加</span>
        <div class="hot-filter-row" id="manage-hot-filter"></div>
        <div class="popular-scroll-row" id="manage-hot-list"></div>
      </div>

      <div class="add-bar">
        <button class="btn-add" id="manage-add-btn">+ 自定义菜品</button>
      </div>

      <div id="manage-form"></div>
      <div id="manage-dish-list"></div>

      <div class="family-entry" style="margin-top:20px;">
        <button class="btn-family-entry" id="manage-family-btn">👨‍👩‍👧 家庭共享</button>
      </div>
    </div>

    <!-- 家庭列表 -->
    <div class="page-container" id="page-family"></div>

    <!-- 家庭详情 -->
    <div class="page-container" id="page-family-detail"></div>

    <!-- Tab Bar -->
    <div id="tab-bar">
      <button class="tab-item active" data-tab="0">
        <span class="tab-icon">🎲</span>
        <span>随机开饭</span>
      </button>
      <button class="tab-item" data-tab="1">
        <span class="tab-icon">📋</span>
        <span>菜品管理</span>
      </button>
    </div>

    <!-- Toast -->
    <div id="toast"></div>

    <!-- Modal -->
    <div id="modal-overlay">
      <div id="modal-box">
        <span id="modal-title"></span>
        <span id="modal-content"></span>
        <div id="modal-actions">
          <button id="modal-cancel">取消</button>
          <button id="modal-confirm">确认</button>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div id="loading-overlay">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <span class="loading-text">加载中...</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

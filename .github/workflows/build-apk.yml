name: Build APK

on:
  push:
    branches: [main, master, android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android_app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-33" "build-tools;33.0.0" > /dev/null 2>&1 || true

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android_app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-dish-debug
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "最新版本"
          tag_name: latest
          files: android_app/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true
        continue-on-error: true

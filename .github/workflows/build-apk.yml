name: Build APK
on:
  push: { branches: [android] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" >> java-app/local.properties
          ls -la $ANDROID_SDK_ROOT/platforms/ 2>/dev/null || echo "no-platforms"
          ls -la $ANDROID_SDK_ROOT/build-tools/ 2>/dev/null || echo "no-build-tools"
          # Accept licenses and install needed packages
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Build APK
        working-directory: java-app
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: java-app/app/build/outputs/apk/debug/app-debug.apk }
      - uses: softprops/action-gh-release@v2
        with: { name: "最新版本", tag_name: "latest", files: java-app/app/build/outputs/apk/debug/app-debug.apk, prerelease: true, make_latest: true }

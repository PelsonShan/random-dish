name: Build Android APK

on:
  push:
    branches: [android]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Dependencies
        working-directory: android-project
        run: npm install

      - name: Build Capacitor Android
        working-directory: android-project
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: android-project/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-dish-apk
          path: android-project/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "今天吃啥呀？ ${{ github.ref_name }}"
          files: android-project/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true

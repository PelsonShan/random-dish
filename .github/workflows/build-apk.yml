name: Build APK

on:
  push:
    branches: [android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "sdk.dir=/usr/local/lib/android/sdk" >> local.properties
          ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "SDK not found, installing..."
          if [ ! -d /usr/local/lib/android/sdk ]; then
            mkdir -p /usr/local/lib/android/sdk/cmdline-tools
            cd /usr/local/lib/android/sdk/cmdline-tools
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
            unzip -qo tools.zip
            mv cmdline-tools latest 2>/dev/null || true
            rm tools.zip
            yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
            /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Install Dependencies
        working-directory: android-project
        run: npm install

      - name: Init Android
        working-directory: android-project
        run: npx cap add android

      - name: Build APK
        working-directory: android-project/android
        run: ./gradlew assembleDebug

      - uses: softprops/action-gh-release@v2
        with:
          name: "最新版本"
          tag_name: "latest"
          files: android-project/android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          make_latest: true

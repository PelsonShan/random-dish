name: Build APK
on:
  push: { branches: [android] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          ls $ANDROID_HOME/platforms/ 2>/dev/null
          ls $ANDROID_HOME/build-tools/ 2>/dev/null
          # Install missing components
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" 2>/dev/null || true
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/34.0.0" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" 2>/dev/null || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Build APK
        working-directory: java-app
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with: { name: app-debug, path: java-app/app/build/outputs/apk/debug/app-debug.apk }
      - uses: softprops/action-gh-release@v2
        with: { name: "最新版本", tag_name: "latest", files: java-app/app/build/outputs/apk/debug/app-debug.apk, prerelease: true, make_latest: true }
